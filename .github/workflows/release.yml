name: release

# 推 v* 标签时自动：校验版本 → 跑测试 → 打包 → 发 npm → 发 GitHub Release（挂 tgz）。
# 资产名固定为 dsh-cua-linux.tgz（不带版本号）：
#   latest/download/ 只解析 latest，文件名照字面取，带版本号会在下次发版后 404。
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 建 Release、传资产
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm install --no-audit --no-fund

      - run: npm run check

      - run: npm test

      - name: Prepare release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "${RUNNER_TEMP}/dsh-release-notes.md"

      - name: Pack
        run: |
          npm pack
          mv dsh-cua-linux-*.tgz dsh-cua-linux.tgz
          ls -lh dsh-cua-linux.tgz
          tar tzf dsh-cua-linux.tgz | head -20

      # 幂等：版本已在 registry 上就跳过，重推 tag 不会因 E403 整条失败。
      # continue-on-error：npm 出问题不该阻断 GitHub Release（资产才是主要安装路径），
      # 最终是否算失败由最后一步的严格核对决定。
      - name: Publish to npm
        id: npm_publish
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-cua-linux@${version}" version >/dev/null 2>&1; then
            echo "::notice::dsh-cua-linux@${version} 已在 npm 上，跳过发布"
            exit 0
          fi
          out="$(npm publish --provenance --access public 2>&1)"
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qE 'E401|E403|EOTP|401 Unauthorized'; then
              echo "::error::npm 拒绝发布：NPM_TOKEN 可能过期/权限不足，或账号要求 2FA。"
              echo "::error::重新生成 token、更新 Secret NPM_TOKEN，然后重推 tag。"
            fi
            exit $code
          fi
          echo "::notice::npm publish 返回成功，等待 registry 传播"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-cua-linux.tgz
          body_path: ${{ runner.temp }}/dsh-release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      # npm 的 registry 传播要几十秒，而且新包名首次发布可能只留 0.0.0-stage 占位包。
      # 放在 Release 之后严格核对：失败就让整条流水线红，但资产已经产出。
      - name: Verify npm actually serves this version
        if: env.NPM_TOKEN != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 18); do
            if npm view "dsh-cua-linux@${version}" version >/dev/null 2>&1; then
              echo "::notice::registry 已提供 dsh-cua-linux@${version}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::dsh-cua-linux@${version} 在 3 分钟后仍不可用"
          npm view dsh-cua-linux dist-tags --json || true
          exit 1
